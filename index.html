<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>يوسف | WhatsApp</title>
<style>
:root{--green:#075e54;--header:#075e54;--out:#d9fdd3;--in:#fff;--wall:#efeae2;--text:#111b21;--muted:#667781}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;color:var(--text)}
body{background:#d1d7db;display:flex;justify-content:center}
.app{width:100%;max-width:900px;height:100dvh;background:var(--wall);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 30px #0002}
.top{height:68px;flex-shrink:0;background:var(--header);color:white;display:flex;align-items:center;gap:12px;padding:9px 14px}
.pfp{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#c9d8d4;flex-shrink:0}
.contact{flex:1;min-width:0}.name{font-size:17px;font-weight:700}.status{font-size:12px;color:#d2e8e4;margin-top:4px}
.top-icons{font-size:22px;letter-spacing:8px;opacity:.9}
.chat{flex:1;overflow-y:auto;padding:18px 12px 22px;background-color:var(--wall);background-image:radial-gradient(#b9b0a3 0.55px,transparent .55px);background-size:14px 14px;scroll-behavior:smooth}
.notice{max-width:90%;margin:0 auto 16px;background:#fff3c4;color:#655d4a;border-radius:8px;padding:8px 12px;text-align:center;font-size:12px;line-height:1.6;box-shadow:0 1px 1px #0001}
.day{text-align:center;margin:10px auto 16px;background:#e1f3fb;color:#54656e;border-radius:7px;padding:6px 12px;width:max-content;font-size:12px}
.msg{max-width:min(78%,560px);padding:8px 10px 5px;border-radius:8px;margin:7px 0;box-shadow:0 1px 1px #0001;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:15px;position:relative}
.msg.in{background:var(--in);margin-left:auto;border-top-right-radius:0}
.msg.out{background:var(--out);margin-right:auto;border-top-left-radius:0}
.meta{display:flex;justify-content:flex-end;gap:4px;align-items:center;font-size:10px;color:var(--muted);margin-top:3px}
.ticks{color:#53a7db;font-size:13px}
.typing{background:#fff;border-radius:9px;padding:10px 13px;width:max-content;color:#667781;font-size:13px;margin-left:auto;display:none}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#82939a;margin:0 2px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}
.composer{background:#f0f2f5;display:flex;align-items:flex-end;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));flex-shrink:0}
.field{flex:1;background:white;border-radius:24px;display:flex;align-items:flex-end;padding:8px 13px;min-width:0}
textarea{width:100%;border:0;outline:0;resize:none;max-height:120px;min-height:24px;font:15px Arial,"Noto Sans Arabic",sans-serif;line-height:1.5;background:transparent;color:var(--text);direction:rtl}
.send{width:45px;height:45px;border:0;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:21px;cursor:pointer;flex-shrink:0}
.send:disabled{opacity:.5;cursor:default}.bottom-note{text-align:center;font-size:10px;color:#667781;background:#f0f2f5;padding:0 8px 4px}
.error{background:#fff1f0;color:#9f2924;padding:8px 12px;border-radius:8px;font-size:13px;max-width:85%;margin:8px auto;text-align:center}
@media(min-width:700px){.app{height:calc(100dvh - 28px);margin:14px 0;border-radius:8px}.top{border-radius:8px 8px 0 0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="pfp" src="pfp.png" alt="صورة يوسف" onerror="this.style.visibility='hidden'">
    <div class="contact"><div class="name">يوسف</div><div class="status" id="status">متصل</div></div>
    <div class="top-icons" aria-hidden="true">⋮</div>
  </header>
  <main class="chat" id="chat" aria-live="polite">
    <div class="notice">هذه محادثة تجريبية مع شخصية ذكاء اصطناعي. لا ترسل معلومات شخصية أو حساسة. المحادثة لا تُحفظ بعد تحديث الصفحة أو إغلاقها.</div>
    <div class="day">اليوم</div>
    <div class="msg in"><div>سلام! أنا يوسف 😊 واش راك؟</div><div class="meta"><span>الآن</span></div></div>
    <div class="typing" id="typing"><span class="dots"><span></span><span></span><span></span></span></div>
  </main>
  <form class="composer" id="form">
    <div class="field"><textarea id="message" rows="1" placeholder="اكتب رسالة" aria-label="اكتب رسالة" maxlength="2000"></textarea></div>
    <button class="send" id="send" type="submit" aria-label="إرسال">➤</button>
  </form>
  <div class="bottom-note">يوسف — محادثة تجريبية</div>
</div>
<script>
/*
  After deploying your Cloudflare Worker, paste its URL below.
  Example: https://youssef-chat.your-subdomain.workers.dev
*/
const WORKER_URL = "PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");
const typing = document.getElementById("typing");
const statusText = document.getElementById("status");
let history = []; // Memory only while this page remains open; never saved to a database.

function timeNow(){ return new Intl.DateTimeFormat("ar-DZ",{hour:"2-digit",minute:"2-digit"}).format(new Date()); }
function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }
function addMessage(text, kind){
  const bubble = document.createElement("div");
  bubble.className = "msg " + kind;
  const body = document.createElement("div");
  body.textContent = text;
  const meta = document.createElement("div");
  meta.className = "meta";
  const time = document.createElement("span"); time.textContent = timeNow(); meta.appendChild(time);
  if(kind === "out"){ const ticks = document.createElement("span"); ticks.className="ticks"; ticks.textContent="✓✓"; meta.appendChild(ticks); }
  bubble.append(body,meta);
  chat.insertBefore(bubble, typing);
  scrollBottom();
}
function showError(text){
  const el=document.createElement("div");el.className="error";el.textContent=text;
  chat.insertBefore(el,typing);scrollBottom();
}
function resizeInput(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";}
input.addEventListener("input",resizeInput);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});

form.addEventListener("submit", async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text || send.disabled)return;
  if(WORKER_URL==="PASTE_YOUR_CLOUDFLARE_WORKER_URL_HERE"){
    showError("باقي خطوة صغيرة: اربط الموقع برابط Cloudflare Worker حسب التعليمات في README.");
    return;
  }
  addMessage(text,"out");
  input.value="";resizeInput();
  history.push({role:"user",content:text});
  // Keep only recent turns to reduce token use.
  history=history.slice(-12);
  send.disabled=true;typing.style.display="block";statusText.textContent="يكتب...";
  scrollBottom();
  try{
    const response=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||"تعذر الاتصال بالذكاء الاصطناعي ("+response.status+")");
    if(typeof data.reply!=="string"||!data.reply.trim())throw new Error("وصل رد غير صالح من الخادم.");
    history.push({role:"assistant",content:data.reply});
    history=history.slice(-12);
    addMessage(data.reply,"in");
  }catch(err){
    history.pop(); // Let the visitor retry without retaining a failed user turn.
    showError("ما قدرتش نجاوبك الآن. "+(err.message||"تحقق من الاتصال وإعدادات Cloudflare."));
  }finally{
    typing.style.display="none";send.disabled=false;statusText.textContent="متصل";input.focus();scrollBottom();
  }
});
</script>
</body>
</html>
